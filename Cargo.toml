[workspace]
resolver = "3"
members = ["crates/*"]
# The vendored Craft repos are path dependencies, not members: each keeps its own workspace.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
wordcraft-ui-egui = { path = "vendor/wordcraft/crates/ui-egui" }
wordcraft-engine = { path = "vendor/wordcraft/crates/engine" }
gridcraft-ui-egui = { path = "vendor/gridcraft/crates/ui-egui" }
gridcraft-engine = { path = "vendor/gridcraft/crates/engine" }
deckcraft-ui-egui = { path = "vendor/deckcraft/crates/ui-egui" }
deckcraft-engine = { path = "vendor/deckcraft/crates/engine" }
pdfcraft-ui-egui = { path = "vendor/pdfcraft/crates/ui-egui" }
pdfcraft-engine = { path = "vendor/pdfcraft/crates/engine" }

# Same lints as the Craft repos (AGENTS.md "Never crash"). craftworks-ffi and one module of
# craftworks-render are the only places allowed `unsafe` (docs/decisions.md D9).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
# PdfCraft's vendored renderer/PDF crates, for the whole graph.
hayro-interpret = { path = "vendor/pdfcraft/vendor/hayro-interpret" }
hayro = { path = "vendor/pdfcraft/vendor/hayro" }
hayro-syntax = { path = "vendor/pdfcraft/vendor/hayro-syntax" }
hayro-cmap = { path = "vendor/pdfcraft/vendor/hayro-cmap" }
hayro-postscript = { path = "vendor/pdfcraft/vendor/hayro-postscript" }
hayro-jbig2 = { path = "vendor/pdfcraft/vendor/hayro-jbig2" }
lopdf = { path = "vendor/pdfcraft/vendor/lopdf" }
vello_common = { path = "vendor/pdfcraft/vendor/vello_common" }
vello_cpu = { path = "vendor/pdfcraft/vendor/vello_cpu" }
# egui fork: one revision for everyone (docs/decisions.md D7).
ecolor = { git = "https://github.com/storytold/egui.git", rev = "725a39fca940f77149ffbb9c58eef405a16997bc" }
emath = { git = "https://github.com/storytold/egui.git", rev = "725a39fca940f77149ffbb9c58eef405a16997bc" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "725a39fca940f77149ffbb9c58eef405a16997bc" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "725a39fca940f77149ffbb9c58eef405a16997bc" }
egui = { git = "https://github.com/storytold/egui.git", rev = "725a39fca940f77149ffbb9c58eef405a16997bc" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "725a39fca940f77149ffbb9c58eef405a16997bc" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "725a39fca940f77149ffbb9c58eef405a16997bc" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "725a39fca940f77149ffbb9c58eef405a16997bc" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "725a39fca940f77149ffbb9c58eef405a16997bc" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "725a39fca940f77149ffbb9c58eef405a16997bc" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "725a39fca940f77149ffbb9c58eef405a16997bc" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "725a39fca940f77149ffbb9c58eef405a16997bc" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "725a39fca940f77149ffbb9c58eef405a16997bc" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "725a39fca940f77149ffbb9c58eef405a16997bc" }

